{% extends "base.html" %}{% set active='files' %}
{% block content %}
<style>
  .tabs { display: flex; gap: 5px; margin-bottom: 15px; flex-wrap: wrap; }
  .tab-btn { background: var(--bg3); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 5px; cursor: pointer; font-size: 13px; flex: 1; text-align: center; }
  .tab-btn.active { background: var(--accent); color: #000; font-weight: bold; border-color: var(--accent); }
  .file-item { display: flex; justify-content: space-between; align-items: center; background: var(--bg3); padding: 10px; border-radius: 8px; margin-bottom: 8px; border: 1px solid var(--border); }
  .file-name { font-size: 14px; color: var(--text); font-weight: bold; word-break: break-all; }
  .file-size { font-size: 12px; color: var(--muted); }
  .del-btn { background: var(--bad); color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 12px; }
</style>

<div class="card" style="text-align:center;">
  <h2>📁 مدير الملفات</h2>
  <p style="color:var(--muted);font-size:13px;">تخزين الملفات (بايلودات، كلمات مرور، نتائج) في مجلدات منفصلة.</p>
</div>

<div class="tabs" id="tabs">
  <button class="tab-btn active" onclick="switchTab('general')">📂 عام</button>
  <button class="tab-btn" onclick="switchTab('c2')">💀 C2</button>
  <button class="tab-btn" onclick="switchTab('hydra')">🔑 Hydra</button>
  <button class="tab-btn" onclick="switchTab('sqli')">💉 SQLi</button>
</div>

<div class="card">
  <div style="display:flex; gap:10px; align-items:center;">
    <input type="file" id="fileInput" style="flex:1;">
    <button onclick="uploadFile()" style="background:var(--ok); color:#000; font-weight:bold;">⬆️ رفع</button>
  </div>
  <div id="statusText" style="margin-top:10px; font-size:13px; color:var(--muted);"></div>
</div>

<div class="card">
  <h3 id="currentTitle">📂 ملفات عامة</h3>
  <div id="fileList">جارٍ التحميل...</div>
</div>
{% endblock %}

{% block scripts %}
<script>
let currentCategory = 'general';

function switchTab(cat) {
    currentCategory = cat;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    const titles = {general: '📂 ملفات عامة', c2: '💀 بايلودات C2', hydra: '🔑 كلمات مرور Hydra', sqli: '💉 نتائج SQLi'};
    document.getElementById('currentTitle').textContent = titles[cat];
    loadFiles();
}

async function loadFiles() {
    const list = document.getElementById("fileList");
    list.innerHTML = "جارٍ التحميل...";
    try {
        const res = await fetch("/api/files/list?category=" + currentCategory);
        const data = await res.json();
        if(data.success) {
            if(data.files.length === 0) {
                list.innerHTML = "<div style='text-align:center;color:var(--muted);padding:20px;'>لا توجد ملفات في هذا المجلد.</div>";
                return;
            }
            list.innerHTML = "";
            data.files.forEach(f => {
                const sizeKB = (f.size / 1024).toFixed(1);
                list.innerHTML += `<div class="file-item">
                    <div>
                        <div class="file-name">📄 ${f.name}</div>
                        <div class="file-size">${sizeKB} KB</div>
                    </div>
                    <button class="del-btn" onclick="deleteFile('${f.name}')">🗑️ حذف</button>
                </div>`;
            });
        } else {
            list.innerHTML = `<span style="color:var(--bad)">${data.message}</span>`;
        }
    } catch(e) { list.innerHTML = "❌ خطأ في الاتصال"; }
}

async function uploadFile() {
    const input = document.getElementById("fileInput");
    const status = document.getElementById("statusText");
    if(!input.files.length) { alert("اختر ملفاً أولاً"); return; }
    
    const formData = new FormData();
    formData.append("file", input.files[0]);
    formData.append("category", currentCategory);
    
    status.textContent = "⏳ جاري الرفع...";
    try {
        const res = await fetch("/api/files/upload", { method: "POST", body: formData });
        const data = await res.json();
        status.textContent = data.message;
        input.value = "";
        loadFiles();
    } catch(e) { status.textContent = "❌ فشل الرفع"; }
}

async function deleteFile(name) {
    if(!confirm("حذف الملف " + name + "؟")) return;
    try {
        const res = await fetch("/api/files/delete", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({category: currentCategory, filename: name})
        });
        const data = await res.json();
        alert(data.message);
        loadFiles();
    } catch(e) { alert("فشل الحذف"); }
}

loadFiles();
</script>
{% endblock %}
